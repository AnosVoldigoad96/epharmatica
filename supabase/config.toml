# Supabase CLI configuration — ePharmatica local stack.
# Minimal, valid config; unspecified settings fall back to CLI defaults.
# See development-plan.md 0.B (local stack + seed) and 0.D (migrations 001–010).

project_id = "epharmatica"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "https://epharmatica.com/auth/callback",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Google OAuth (M2 §4.2) — enabled on the VPS via GOTRUE_EXTERNAL_GOOGLE_*
# env (see docs/runbooks/auth-deploy.md §2/§3). Left disabled here so the
# config is valid without committing secrets; flip `enabled` and supply the
# env-referenced client id/secret to exercise the OAuth path locally.
[auth.external.google]
enabled = false
client_id = "env(GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(GOTRUE_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false
