# ePharmatica — production deploy on merge to main
# Spec: PRD §13.4 · development-plan.md §4 (0.B) · ARCHITECTURE.md §8
#
# Target pipeline (PRD §13.4): merge to main → build (+ image) → Coolify webhook deploy
# → gated migration step (automatic pre-migration dump) → smoke ping → Sentry release
# + sourcemaps. Steps whose infrastructure does not exist yet are explicit TODOs below,
# and the webhook trigger is skipped honestly (with a notice) until its secret exists —
# nothing here fakes success.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # One production deploy at a time; never cancel an in-flight deploy.
  group: deploy-production
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Verify + build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        # Version resolved from the root package.json "packageManager" field.
        uses: pnpm/action-setup@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Turborepo task outputs
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Prettier)
        run: pnpm prettier --check .

      - name: Lint (turbo)
        run: pnpm turbo run lint

      - name: Typecheck (turbo)
        run: pnpm turbo run typecheck

      - name: Build (turbo)
        run: pnpm turbo run build
        env:
          # Placeholder values so `next build` can run in CI without a live Supabase
          # stack — the production build with real values happens on the VPS via
          # Coolify (env from the Coolify store only, PRD Appendix A).
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'http://127.0.0.1:54321' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}

      - name: Test (turbo)
        run: pnpm turbo run test

  # Deploy topology (founder decision, 19 Jul 2026 — supersedes the plan's Coolify
  # assumption): the shared Hetzner box runs plain compose + a Cloudflare tunnel.
  # CI connects with a dedicated key whose authorized_keys entry carries a FORCED
  # COMMAND — the key can only run /opt/epharmatica-app/deploy-from-ci.sh
  # (pull → build → compose up → health gate), nothing else. Least privilege on a
  # box shared with an unrelated product (rules.md I11).
  deploy:
    name: Deploy to production (SSH)
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Detect deploy key secret
        id: sshkey
        # The secrets context is not available in `if:` expressions, so presence is
        # detected here and the deploy step gates on this output.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -n "$DEPLOY_SSH_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over SSH (forced command on the server)
        if: steps.sshkey.outputs.configured == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Host key pinned — no TOFU in CI.
          echo "178.63.23.176 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMcTDuuJPbOdUBl/pIY1oBZrPnoUaUJa7rTuwIv/yHUR" >> ~/.ssh/known_hosts
          # The command string is ignored by the server's forced command; passing
          # it anyway documents intent.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@178.63.23.176 deploy-from-ci

      - name: Deploy skipped — DEPLOY_SSH_KEY not configured
        if: steps.sshkey.outputs.configured != 'true'
        run: |
          echo "::notice::DEPLOY_SSH_KEY secret is not configured — deploy skipped."
          echo "::notice::Add the CI deploy private key as a repository secret to enable deploy-on-merge (development-plan.md §4 0.B)."

      # TODO(PRD §13.4 — GATED MIGRATION STEP; activate when supabase/ migrations and
      # production DB access exist). Contract, in order:
      #   1. AUTOMATIC PRE-MIGRATION DUMP first: pg_dump -Fc (custom format) of the
      #      production database to the encrypted backup store (R2/B2, 30-day
      #      retention). The migration step never runs without a fresh dump.
      #   2. Run the gated `supabase db push`-equivalent against production
      #      (forward-only in-repo migrations — rules.md I7; rollback = new forward
      #      migration, never a down-migration).
      #   3. Abort the pipeline if the dump fails — do not apply migrations.
      # - name: Pre-migration dump + gated migration
      #   run: ...

      # TODO(0.A — activate when production is reachable): post-deploy smoke ping.
      # - name: Smoke ping
      #   run: curl --fail --retry 5 --retry-delay 10 https://epharmatica.com/

      # TODO(0.A — activate when the Sentry project exists): Sentry release +
      # sourcemaps, release tagging from CI (rules.md §11.4; PII scrubbing per
      # securities.md §13).
